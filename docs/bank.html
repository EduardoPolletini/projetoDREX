<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banco Horizonte | Autenticação simulada</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./bank.js"></script>
</head>
<body>
<header><div class="wrap bar"><span class="brand"><i class="brand-mark" aria-hidden="true"></i>Banco Horizonte</span><span class="environment">Instituição simulada</span></div></header>
<main class="wrap bank screen">
  <section class="hero">
    <p class="eyebrow">Open Finance · Autenticação</p>
    <h1>Valide sua identidade</h1>
    <p>Após a validação, você voltará ao DREX Lab para confirmar o compartilhamento do saldo.</p>
  </section>
  <section class="card bank-form">
    <h2>Autenticação de demonstração</h2>
    <p class="consent-status">Use o código fictício <strong>246810</strong>.</p>
    <!-- Recebe apenas o PIN fictício da demonstração. -->
    <form id="bankForm">
      <label for="pin">Código de demonstração</label>
      <div class="actions"><input id="pin" type="password" inputmode="numeric" minlength="6" maxlength="6" required autocomplete="off"><button>Autenticar</button></div>
    </form>
    <p id="bankError" role="status" hidden></p>
    <a class="text-link" href="./#open-finance"><span aria-hidden="true">←</span> Voltar ao DREX Lab</a>
  </section>
</main>
</body>
</html>
